
<!DOCTYPE html>

    <html lang="pt-br">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="scripts.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Meu jeito ninja de Investir</title>

    </head>

    <body>

        <div class="container mt-5">
            <div class="card caixa mx-auto shadow">
                <div class="card-body p-4">

                    <h1 class="text-center titulo">
                        Meu jeito ninja de Investir
                    </h1>

                    <h4 class="text-center mb-4">
                        CryptoDattebayo
                    </h4>

                    <label for="moeda" class="form-label">
                        Escolha as moedas:
                    </label>

                    <select id="moeda" class="form-select mb-3">
                        <option value="BTC-BRL">BTC - BRL</option>
                        <option value="BTC-USD">BTC - USD</option>
                        <option value="BRL-USD">BRL - USD</option>
                    </select>

                    <label for="valor" class="form-label">
                        Digite o valor:
                    </label>

                    <input type="number" id="valor"
                        class="form-control mb-3"
                        placeholder="Digite um valor">

                    <button onclick="converterMoeda()"
                        class="btn botao w-100">
                        Converter
                    </button>

                    <div class="alert resultado text-center mt-4 mb-0">
                        <h5 id="resultado">
                            O resultado aparecerá aqui.
                        </h5>
                    </div>

                </div>
            </div>
        </div>


    </body>

</html>
